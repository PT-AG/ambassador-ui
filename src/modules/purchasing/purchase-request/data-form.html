<template>
  <au-input-form 
        title.bind="title" 
        with.bind="context">

        <div slot="actions" class="btn-group">
            <button class="btn btn-default" click.delegate="context.cancel($event)" if.one-way="context.hasCancel">Kembali</button>
            <button class="btn btn-primary" click.delegate="context.edit($event)" if.one-way="context.hasEdit">Ubah</button>
            <button class="btn btn-success" click.delegate="context.save($event)" if.one-way="context.hasSave">Simpan</button>
            <button class="btn btn-danger" click.delegate="context.delete($event)" if.one-way="context.hasDelete">Hapus</button>
            <button class="btn btn-primary" click.delegate="context.unpost($event)" if.one-way="context.hasUnpost">Unpost</button>
            <button class="btn btn-success" click.delegate="context.approve($event)" if.one-way="context.hasApprove">Approve</button>
            <button class="btn btn-danger" click.delegate="context.reject($event)" if.one-way="context.hasReject">Reject</button>
        </div>

        <div class="alert alert-danger" if.bind="readOnly && data.isRejected" style="margin-bottom: 15px;">
            <strong>Ditolak</strong> oleh <strong>${data.rejectedBy || '-'}</strong> (${formattedRejectedDate})
            &mdash; Alasan: ${data.reasonRejected || '-'}
        </div>

        <au-textbox 
            label="Dibuat Oleh" 
            value.bind="data.CreatedBy" 
            read-only.bind="true"
            if.bind="readOnly"
            options.bind="controlOptions">
        </au-textbox>

        <au-textbox 
            label="No. PR" 
            value.bind="data.no" 
            error.bind="error.no" 
            read-only.bind="true"
            if.bind="(readOnly || isEdit)"
            options.bind="controlOptions">
        </au-textbox>

        <au-datepicker 
            label="Tgl. PR" 
            value.bind="data.date" 
            error.bind="error.date" 
            read-only.bind="(readOnly || isEdit)"
            options.bind="controlOptions">
        </au-datepicker>

        <au-datepicker 
            label="Tgl. Diminta Datang" 
            value.bind="data.expectedDeliveryDate" 
            error.bind="error.expectedDeliveryDate" 
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-datepicker>

        <au-autocomplete 
            value.bind="data.budget" 
            error.bind="error.budget"
            label="Budget" 
            change.delegate="budgetChanged($event)" 
            loader.bind="budgetLoader"
            placeholder="cari budget" 
            key="code" 
            read-only.bind="(readOnly || isEdit)"
            options.bind="controlOptions">
        </au-autocomplete>

        <au-autocomplete 
            value.bind="data.unit" 
            error.bind="error.unit"
            label="Unit" 
            change.delegate="unitChanged($event)" 
            query.bind="unitQuery"
            loader.bind="unitLoader"
            placeholder="cari unit" 
            key="Code"
            read-only.bind="(readOnly || isEdit)"
            options.bind="controlOptions">
        </au-autocomplete>

        <au-autocomplete 
            value.bind="data.category" 
            error.bind="error.category"
            label="Kategori" 
            change.delegate="categoryChanged($event)" 
            loader.bind="categoryLoader"
            placeholder="cari kategori" 
            key="code"
            read-only.bind="(readOnly || isEdit)"
            options.bind="controlOptions">
        </au-autocomplete>

<!--         <au-checkbox 
            label="Pembelian Internal ?" 
            value.bind="prInternal" 
            error.bind="error.prInternal" 
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-checkbox> -->

        <au-multiline 
            label="Keterangan" 
            value.bind="data.remark"
            placeholder="tambah keterangan" 
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-multiline>

        <au-textbox
            show.bind="error.itemscount"
            error.bind="error.itemscount"
            read-only="true">
        </au-textbox>

        <div if.bind="readOnly" style="margin-top: 15px; margin-bottom: 15px;">
            <label style="font-weight: bold;">Riwayat Approval</label>
            <table class="table table-bordered table-condensed">
                <thead>
                    <tr>
                        <th style="width: 30%;">Tahap Approval</th>
                        <th style="width: 20%; text-align: center;">Status</th>
                        <th style="width: 25%;">Approver</th>
                        <th style="width: 25%; text-align: center;">Tanggal Approval</th>
                    </tr>
                </thead>
                <tbody>
                    <tr repeat.for="step of approvalSteps">
                        <td>
                            ${step.label}
                            <div if.bind="step.note" style="font-size: 12px; color: #a94442; margin-top: 2px;">Alasan: ${step.note}</div>
                        </td>
                        <td style="text-align: center;">
                            <span class="label ${step.badgeClass}">${step.statusText}</span>
                        </td>
                        <td>${step.by}</td>
                        <td style="text-align: center;">${step.date}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <au-collection 
            items.bind="data.items" 
            errors.bind="error.items" 
            columns.bind="itemsColumns" 
            add.bind="addItems" 
            remove.bind="removeItems"
            read-only.bind="readOnly" 
            options.bind="collectionOptions"
            header-template.bind="headerTemplate"
            item-template="modules/purchasing/purchase-request/template/purchase-request-item">
        </au-collection>

  </au-input-form>
</template>
