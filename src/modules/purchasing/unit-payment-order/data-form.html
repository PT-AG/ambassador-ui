<template>
    <au-input-form 
        title.bind="title" 
        with.bind="context">

        <div slot="actions" class="btn-group">
            <button class="btn btn-default" click.delegate="context.cancel($event)"     if.one-way="context.hasCancel">Kembali</button>
            <button class="btn btn-primary" click.delegate="context.edit($event)"       if.one-way="context.hasEdit">Ubah</button>
            <button class="btn btn-success" click.delegate="context.save($event)"       if.one-way="context.hasSave">Simpan</button>
            <button class="btn btn-danger"  click.delegate="context.delete($event)"     if.one-way="context.hasDelete">Hapus</button>
        </div>

        <div class="row">
            <div class="col-md-6">
                <au-textbox 
                    label="No" 
                    value.bind="data.no" 
                    error.bind="error.no" 
                    read-only.bind="true"
                    if.bind="(readOnly || isEdit)"
                    options.bind="controlOptions">
                </au-textbox>
          
                <au-datepicker 
                    label="Tanggal Surat Perintah Bayar" 
                    value.bind="data.date" 
                    error.bind="error.date" 
                    read-only.bind="(readOnly || isEdit)"
                    if.bind="(readOnly || isEdit)"
                    options.bind="controlOptions">
                </au-datepicker>

                <au-autocomplete 
                    value.bind="selectedSupplier" 
                    error.bind="error.supplier"
                    read-only.bind="(readOnly || isEdit)"
                    label="Supplier" 
                    loader.bind="supplierLoader"
                    text.bind = "supplierView"
                    placeholder="cari supplier" 
                    key="code" 
                    options.bind="controlOptions">
                </au-autocomplete>

                <au-autocomplete 
                    value.bind="selectedCategory" 
                    error.bind="error.category"
                    read-only.bind="(readOnly || isEdit)"
                    label="Kategori" 
                    loader.bind="categoryLoader"
                    text.bind = "categoryView"
                    placeholder="cari kategori" 
                    key="code"
                    options.bind="controlOptions">
                </au-autocomplete>

                <au-dropdown
                    label="Term Pembayaran"
                    value.bind="data.paymentMethod"
                    error.bind="error.paymentMethod"
                    read-only.bind="(readOnly || isEdit)"
                    items.bind="termPaymentOptions"
                    change.delegate="paymentMethodChanged($event)" 
                    options.bind="controlOptions">
                </au-dropdown>

                <au-autocomplete 
                    value.bind="selectedCurrency" 
                    error.bind="error.currency"
                    read-only.bind="(readOnly || isEdit)"
                    label="Mata Uang" 
                    loader.bind="currencyLoader"
                    text.bind = "currencyView"
                    placeholder="cari mata uang" 
                    key="code" 
                    options.bind="controlOptions">
                </au-autocomplete>

                <au-textbox 
                    label="No. Invoice" 
                    value.bind="data.invoiceNo" 
                    error.bind="error.invoiceNo" 
                    read-only.bind="readOnly"
                    options.bind="controlOptions">
                </au-textbox>
          
                <au-datepicker 
                    label="Tanggal Invoice" 
                    value.bind="data.invoiceDate" 
                    error.bind="error.invoiceDate" 
                    read-only.bind="readOnly"
                    options.bind="controlOptions">
                </au-datepicker>

                <au-datepicker 
                    label="Tanggal PIB" 
                    value.bind="data.pibDate" 
                    error.bind="error.pibDate" 
                    read-only.bind="readOnly"
                    options.bind="controlOptions">
                </au-datepicker>
          
                <au-textbox 
                    label="No. PIB" 
                    value.bind="data.pibNo" 
                    error.bind="error.pibNono" 
                    read-only.bind="readOnly"
                    options.bind="controlOptions">
                </au-textbox>

                <au-numeric label="Bea Masuk" value.bind="data.importDuty" error.bind="error.importDuty"
                  read-only.bind="readOnly" options.bind="controlOptions" format="0.00">
                </au-numeric>

                <au-numeric label="PPN" value.bind="data.totalVatAmount" error.bind="error.totalVatAmount"
                  read-only.bind="readOnly" options.bind="controlOptions" format="0.00">
                </au-numeric>

                <au-numeric label="PPH" value.bind="data.totalIncomeTaxAmount" error.bind="error.totalIncomeTaxAmount"
                  read-only.bind="readOnly" options.bind="controlOptions" format="0.00">
                </au-numeric>


            </div>
            <div class="col-md-6">  
                <au-checkbox 
                    label="Apakah kena Pph?" 
                    value.bind="data.useIncomeTax" 
                    error.bind="error.useIncomeTax" 
                    read-only.bind="(readOnly || isEdit)"
                    change.delegate="useIncomeTaxChanged($event)"
                    options.bind="controlOptions">
                </au-checkbox>
                
                <au-autocomplete 
                    value.bind="selectedIncomeTax" 
                    error.bind="error.incomeTax"
                    label="Pph" 
                    loader.bind="incomeTaxLoader"
                    text.bind = "incomeTaxView"
                    placeholder="cari pph" 
                    key="" 
                    read-only.bind="(readOnly || isEdit)"
                    if.bind="data.useIncomeTax"
                    options.bind="controlOptions">
                </au-autocomplete>

                <numeric 
                    label="Rate Pph" 
                    value.bind="data.incomeTax.rate" 
                    error.bind="error.incomeTaxRate" 
                    format="0"
                    read-only.bind="true"
                    if.bind="data.useIncomeTax"
                    post-fix="%">
                </numeric>

                <au-dropdown
                    label="PPH Ditanggung oleh"
                    value.bind="data.incomeTaxBy"
                    error.bind="error.incomeTaxBy"
                    read-only.bind="(readOnly || isEdit)"
                    change.delegate="incomeTaxByChanged($event)"
                    show.bind="data.useIncomeTax"
                    items.bind="IncomeTaxByOptions"
                    options.bind="controlOptions">
                </au-dropdown>

                <au-textbox 
                    label="No. Faktur Pajak (PPH)" 
                    value.bind="data.incomeTaxNo" 
                    error.bind="error.incomeTaxNo" 
                    read-only.bind="readOnly"
                    placeholder="masukan nomor faktur pajak (PPH)" 
                    if.bind="data.useIncomeTax"
                    options.bind="controlOptions">
                </au-textbox>
          
                <au-datepicker 
                    label="Tanggal  Faktur Pajak (PPH)" 
                    value.bind="data.incomeTaxDate" 
                    error.bind="error.incomeTaxDate" 
                    read-only.bind="readOnly"
                    if.bind="data.useIncomeTax"
                    options.bind="controlOptions">
                </au-datepicker>

                <au-checkbox 
                    label="Apakah kena Ppn?" 
                    value.bind="data.useVat" 
                    error.bind="error.useVat" 
                    read-only.bind="(readOnly || isEdit)"
                    change.delegate="useVatChanged($event)"
                    options.bind="controlOptions">
                </au-checkbox>

                <au-autocomplete value.bind="selectedVatTax"
                     error.bind="error.vatTax"
                     label="PPN"
                     loader.bind="vatTaxLoader"
                     text.bind="vatTaxView"
                     placeholder="cari vat"
                     key=""
                     if.bind = "data.useVat"
                     change.delegate="selectedVatTaxChanged($event)"
                     read-only.bind="(readOnly || isEdit)"
                     options.bind="controlOptions">
                </au-autocomplete>

                <au-checkbox 
                    label="Apakah barang Mewah?" 
                    value.bind="data.IsLuxury" 
                    error.bind="error.IsLuxury" 
                    read-only.bind="(readOnly || isEdit)"
                    if.bind="data.useVat && data.vatTax.rate=='12'"
                    options.bind="controlOptions">
                </au-checkbox>

                <au-textbox 
                    label="No. Faktur Pajak (PPN)" 
                    value.bind="data.vatNo" 
                    error.bind="error.vatNo" 
                    read-only.bind="readOnly"
                    placeholder="masukan nomor faktur pajak (PPN)" 
                    if.bind="data.useVat"
                    options.bind="controlOptions">
                </au-textbox>
          
                <au-datepicker 
                    label="Tanggal  Faktur Pajak (PPN)" 
                    value.bind="data.vatDate" 
                    error.bind="error.vatDate"
                    if.bind="data.useVat" 
                    read-only.bind="readOnly"
                    options.bind="controlOptions">
                </au-datepicker>
                <au-multiline label="Keterangan" value.bind="data.remark" placeholder="tambah keterangan" read-only.bind="readOnly"
                  options.bind="controlOptions">
                </au-multiline>
                <au-multiline 
                    label="Alasan Keterlambatan" 
                    value.bind="data.reasonLate" 
                    read-only="true" 
                    options.bind="controlOptions">
                </au-multiline>
                <au-dropdown
                    label="Keterangan Nilai Import"
                    value.bind="data.importInfo"
                    error.bind="error.importInfo"
                    read-only.bind="(readOnly || isEdit)"
                    items.bind="importInfo"
                    if.bind="isImport"
                    show.bind="isImport"
                    options.bind="controlOptions">
                </au-dropdown>
                <au-autocomplete 
                    value.bind="data.ApprovedStaffBy" 
                    error.bind="error.ApprovedStaffBy" label="Approved Staff" 
                    loader.bind="purchasingSectionLoader"
                    text="Name" read-only.bind="readOnly || isEdit" 
                    placeholder="cari nama staff" options.bind="controlOptions">
                </au-autocomplete>
            </div>
        </div>

        <!-- File Upload Section -->
    <div class="row">
      <div class="col-md-6">
        <h4>File Dokumen</h4>
        <au-textbox
            show.bind="error.DocumentsFile"
            error.bind="error.DocumentsFile"
            read-only="true">
        </au-textbox>
        <table class="table table-hover table-bordered">
          <thead>
            <th class="col-md-11">File</th>
            <th if.bind="!readOnly" class="col-md-1">
              <button click.delegate="onAddDocument()" class="btn btn-success pull-right">+</button>
            </th>
          </thead>
          <tbody>
            <tr if.bind="!data.DocumentsFileName || data.DocumentsFileName.length < 1">
              <td colspan="2">
                Tidak ada file
              </td>
            </tr>
            <tr if.bind="data.DocumentsFileName" repeat.for="doc of data.DocumentsFileName">
              <td if.bind="readOnly">
                <button class="btn btn-primary justify-content-center"
                  click.delegate="downloadDocument($index)">${doc}</button>
                  <button type="button" class="btn btn-info ml-2"
                click.delegate="previewDocument($index)">Preview</button>
              </td>
              <td if.bind="!readOnly">
                <input if.bind="!documentsPathTemp[$index]" type="file" id="documentInput${$index}"
                  value.bind="documentUpload" change.delegate="documentInputChanged($index)"
                  accept=".pdf, .xls, .xlsx, .doc, .docx">
                <button if.bind="documentsPathTemp[$index]" class="btn btn-primary justify-content-center"
                  click.delegate="downloadDocument($index)">${doc}</button>
                <span class="text-danger" if.bind="error.DocumentsFile[$index]">${error.DocumentsFile[$index]}</span>
              </td>
              <td if.bind="!readOnly">
                <button class="btn btn-danger pull-right" click.delegate="onRemoveDocument($index)">-</button>
                
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- PDF Preview Modal -->
      <div class="modal fade" id="pdfPreviewModal" tabindex="-1" role="dialog" aria-labelledby="previewModalLabel">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
          
            <div class="resize-handle resize-n" data-direction="n"></div>
            <div class="resize-handle resize-s" data-direction="s"></div>
            <div class="resize-handle resize-e" data-direction="e"></div>
            <div class="resize-handle resize-w" data-direction="w"></div>
            <div class="resize-handle resize-ne" data-direction="ne"></div>
            <div class="resize-handle resize-nw" data-direction="nw"></div>
            <div class="resize-handle resize-se" data-direction="se"></div>
            <div class="resize-handle resize-sw" data-direction="sw"></div>
            
            <div class="modal-header">
              <h5 class="modal-title" id="previewModalLabel">Preview</h5>
              <span class="preview-size-indicator">
                Lebar: ${previewWidth}% | Tinggi: ${previewHeight}px
              </span>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <embed id="pdfEmbed" width="100%" type="application/pdf" style="display: none;" css="height: ${previewHeight}px">
              <div id="excelTable" style="display: none; overflow-y: auto;" css="max-height: ${previewHeight}px"></div>
              <img id="imagePreview" style="display: none; max-width: 100%;" css="max-height: ${previewHeight}px">
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>
    </div>

        <au-textbox
            if.bind = "filter.SupplierId && filter.CategoryId && filter.PaymentMethod && filter.CurrencyCode"
            show.bind="error.itemscount"
            error.bind="error.itemscount"
            read-only="true">
        </au-textbox>

        <au-collection 
            if.bind = "filter.SupplierId && filter.CategoryId && filter.PaymentMethod && filter.CurrencyCode"
            items.bind="data.items" 
            errors.bind="error.items" 
            columns.bind="itemsInfo.columns" 
            add.bind="itemsInfo.onAdd" 
            remove.bind="removeItems"
            options.one-way="filter"
            read-only.bind="readOnly"
            view-model.ref="ItemsCollection"
            item-template="modules/purchasing/unit-payment-order/template/unit-payment-order-item">
        </au-collection>

  </au-input-form>
</template>
