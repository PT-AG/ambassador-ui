<template>
    <tr>
        <td>
            <au-checkbox 
                value.bind="data.Select"
                change.delegate="onCheckboxChange($event)"
                read-only.bind="readOnly">
            </au-checkbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.DispositionNoteNo"
                read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-datepicker 
                value.bind="data.DispositionNoteDate"
                read-only.bind="true">
            </au-datepicker>
        </td>
        <td>
            <au-datepicker 
                value.bind="data.DispositionNoteDueDate"
                read-only.bind="true">
            </au-datepicker>
        </td>
        <td>
            <au-textbox
                value.bind="data.ProformaNo"
                read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-textbox
                value.bind="data.SupplierName"
                read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-textbox
                value.bind="data.Category"
                read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-numeric
                value.bind="data.VATAmount"
                read-only.bind="true">
            </au-numeric>
        </td>
        <td>
            <au-numeric
                value.bind="data.TotalPaid"
                format="0,000.00"
                read-only.bind="true">
            </au-numeric>
        </td>
        <td>
            <au-numeric
                value.bind="data.TotalPaidPaymentAccumulated"
                format="0,000.00"
                read-only.bind="true">
            </au-numeric>
        </td>
        <td>
            <input type="text"
                   class="form-control text-right"
                   value.bind="data.displayTotalPaidPayment"
                   focus.trigger="TotalPaidPaymentFocus($event)"
                   mouseup.trigger="TotalPaidPaymentMouseUp($event)"
                   keydown.delegate="TotalPaidPaymentKeydown($event)"
                   input.delegate="TotalPaidPaymentInput($event)"
                   blur.trigger="TotalPaidPaymentBlur($event)">
        </td>
        <td>
            <au-numeric
                value.bind="data.DiffTotalPaidPayment"
                format="0,000.00"
                read-only.bind="true">
            </au-numeric>
        </td>
        <td>
            <au-textbox
                value.bind="data.CurrencyCode"
                read-only.bind="true">
            </au-textbox>
        </td>
    </tr>
    <!-- <tr show.bind="isShowing">
        <td colspan="11">
            <au-collection
                items.bind="data.Details" 
                columns.bind="columns"
                item-template="modules/expedition/payment-disposition-note/templates/detail-view">
            </au-collection>
        </td>  
    </tr> -->
</template>
