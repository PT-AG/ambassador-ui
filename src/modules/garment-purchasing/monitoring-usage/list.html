<template>
    <style>
        table > tbody > tr > td {
            white-space: pre;
        }
    </style>

    <h1 class="page-header">Monitoring Pemakaian Material</h1>
    <form class="form-horizontal">
        <div class="form-group">
            <div class="col-sm-6 col-sm-offset-2">
                <au-dropdown
                    label="Cari Berdasarkan"
                    value.bind="selectedType"
                    options.bind="controlOptions"
                    items.bind="typeOptions">
                </au-dropdown>
                <au-textbox
                    value.bind="roNo"
                    label="Kata Kunci Pencarian"
                    options.bind="controlOptions"
                    placeholder="masukkan kata kunci">
                </au-textbox>
            </div>
            <div class="col-sm-2">
                <button type="button" class="btn btn-success" click.delegate="searching()">Cari</button>
                <button type="button" class="btn btn-success" click.delegate="reset()">Reset</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover" id="myTable">
                <thead class="text-center">
                    <tr>
                        <th scope="col">No<input type="text" class="form-control" aria-label="Filter No" value.bind="filters.index" input.trigger="filterData('index', $event.target.value)"></th>
                        <th scope="col">No RO<input type="text" class="form-control" aria-label="Filter No RO" value.bind="filters.RO_Number" input.trigger="filterData('RO_Number', $event.target.value)"></th>
                        <th scope="col">No PA/PM<input type="text" class="form-control" aria-label="Filter No PA/PM" value.bind="filters.PO_SerialNumber" input.trigger="filterData('PO_SerialNumber', $event.target.value)"></th>
                        <th scope="col">Kode Produk<input type="text" class="form-control" aria-label="Filter Kode Produk" value.bind="filters.ProductCode" input.trigger="filterData('ProductCode', $event.target.value)"></th>
                        <th scope="col">Nama Produk<input type="text" class="form-control" aria-label="Filter Nama Produk" value.bind="filters.ProductName" input.trigger="filterData('ProductName', $event.target.value)"></th>
                        <th scope="col">Color<input type="text" class="form-control" aria-label="Filter Color" value.bind="filters.Color" input.trigger="filterData('Color', $event.target.value)"></th>
                        <th scope="col">Qty RO<input type="text" class="form-control" aria-label="Filter Qty RO" value.bind="filters.BudgetQuantity" input.trigger="filterData('BudgetQuantity', $event.target.value)"></th>
                        <th scope="col">Qty Pemakaian<input type="text" class="form-control" aria-label="Filter Qty Pemakaian" value.bind="filters.Quantity" input.trigger="filterData('Quantity', $event.target.value)"></th>
                        <th scope="col">Satuan<input type="text" class="form-control" aria-label="Filter Satuan" value.bind="filters.UomUnit" input.trigger="filterData('UomUnit', $event.target.value)"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr repeat.for="item of filteredData">
                        <td class="text-left">${item.index}</td>
                        <td class="text-left">${item.RO_Number}</td>
                        <td class="text-left">${item.PO_SerialNumber}</td>
                        <td class="text-left">${item.ProductCode}</td>
                        <td class="text-left">${item.ProductName}</td>
                        <td class="text-left">${item.Color}</td>
                        <td class="text-left">${item.BudgetQuantity}</td>
                        <td class="text-left">${item.Quantity}</td>
                        <td class="text-left">${item.UomUnit}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="alert alert-info text-center" role="alert" if.bind="data.length === 0">
            Tidak ada data ditemukan.
        </div>
        <hr />
    </form>
</template>
