<template>
    <style>
/* Resizable Modal Styles */
    #pdfPreviewModal .modal-dialog {
      position: relative;
      margin: 30px auto;
      width: 90%;
      max-width: 90%;
    }

    .resize-handle {
      position: absolute;
      z-index: 10;
    }

    .resize-handle.resize-e {
      right: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      cursor: ew-resize;
    }

    .resize-handle.resize-w {
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      cursor: ew-resize;
    }

    .resize-handle.resize-s {
      left: 0;
      right: 0;
      bottom: 0;
      height: 10px;
      cursor: ns-resize;
    }

    .resize-handle.resize-n {
      left: 0;
      right: 0;
      top: 0;
      height: 10px;
      cursor: ns-resize;
    }

    .resize-handle.resize-se {
      right: 0;
      bottom: 0;
      width: 15px;
      height: 15px;
      cursor: nwse-resize;
    }

    .resize-handle.resize-sw {
      left: 0;
      bottom: 0;
      width: 15px;
      height: 15px;
      cursor: nesw-resize;
    }

    .resize-handle.resize-ne {
      right: 0;
      top: 0;
      width: 15px;
      height: 15px;
      cursor: nesw-resize;
    }

    .resize-handle.resize-nw {
      left: 0;
      top: 0;
      width: 15px;
      height: 15px;
      cursor: nwse-resize;
    }

    .resize-handle:hover {
      background-color: rgba(0, 123, 255, 0.1);
    }

    .preview-size-indicator {
      position: absolute;
      top: 10px;
      right: 50px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 5px 10px;
      border-radius: 3px;
      font-size: 12px;
      pointer-events: none;
      z-index: 1060;
    }

</style>

    <au-input-form 
        title.bind="title" 
        with.bind="context">

        <div slot="actions" class="btn-group">
            <button class="btn btn-default" click.delegate="context.cancel($event)"     if.one-way="context.hasCancel">Kembali</button>
            <button class="btn btn-primary" click.delegate="context.edit($event)"       if.one-way="context.hasEdit">Ubah</button>
            <button class="btn btn-success" click.delegate="context.save($event)"       if.one-way="context.hasSave">Simpan</button>
            <button class="btn btn-danger"  click.delegate="context.delete($event)"     if.one-way="context.hasDelete">Hapus</button>
        </div>
        <au-textbox 
            label="ID" 
            value.bind="data.Id" 
            error.bind="error.Id" 
            read-only.bind="true"
            if.bind="false"
            options.bind="controlOptions">
        </au-textbox>

        <au-textbox 
            label="No" 
            value.bind="data.DispositionNo" 
            error.bind="error.DispositionNo" 
            read-only.bind="true"
            if.bind="(readOnly || isEdit)"
            options.bind="controlOptions">
        </au-textbox>

        <!-- <au-autocomplete 
            value.bind="selectedCategory" 
            error.bind="error.Category"
            read-only.bind="(readOnly || isEdit)"
            label="Kategori" 
            loader.bind="categoryLoader"
            text.bind = "categoryView"
            placeholder="cari kategori" 
            key="code"
            options.bind="controlOptions">
        </au-autocomplete> -->

        <au-dropdown 
        label="Kategori" 
        value.bind="data.Category" 
        error.bind="error.Category"
        read-only.bind="readOnly" 
        items.bind="itemCategory" 
        options.bind="controlOptions">
        </au-dropdown>

        <au-autocomplete 
            value.bind="selectedSupplier" 
            error.bind="error.Supplier"
            label="Supplier" 
            loader.bind="supplierLoader"
            text.bind = "supplierView"
            placeholder="cari supplier" 
            key="code" 
            read-only.bind="(readOnly || isEdit)"
            options.bind="controlOptions">
        </au-autocomplete>

        <au-autocomplete 
            value.bind="selectedCurrency" 
            error.bind="error.Currency"
            label="Mata Uang" 
            loader.bind="currencyLoader"
            text.bind = "currencyView"
            placeholder="cari mata uang" 
            key="code" 
            read-only.bind="(readOnly || isEdit)"
            options.bind="controlOptions">
        </au-autocomplete>

        <au-multiline
            value.bind="data.Bank"
            error.bind="error.Bank"
            placeholder="bank"
            label="Bank Tujuan" 
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-multiline>

        <au-textbox
            value.bind="data.ConfirmationOrderNo"
            error.bind="error.ConfirmationOrderNo"
            placeholder="no order confirmation"
            label="No Order Confirmation" 
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-textbox>

        <au-dropdown 
            label="Tipe Pembayaran" 
            value.bind="data.PaymentType" 
            error.bind="error.PaymentType"
            read-only.bind="readOnly" 
            change.delegate="paymentTypeChanged($event)"
            items.bind="itemPaymentType" 
            options.bind="controlOptions">
        </au-dropdown>

        <au-datepicker 
            label="Tanggal Jatuh Tempo" 
            value.bind="data.PaymentDueDate" 
            error.bind="error.PaymentDueDate" 
            read-only.bind="(readOnly)"
            options.bind="controlOptions">
        </au-datepicker>
                
        <au-multiline 
            label="Keterangan" 
            value.bind="data.Remark"
            placeholder="tambah keterangan" 
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-multiline>

        <au-textbox
            value.bind="data.ProformaNo"
            error.bind="error.ProformaNo"
            label="No Proforma / Invoice" 
            placeholder="no proforma"
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-textbox>

        <au-numeric
            value.bind="dppVal"
            label="DPP"
            read-only.bind="true"
            if.bind="!readOnly"
            format = "0,0.0000"
            options.bind="controlOptions">
        </au-numeric>

        <au-numeric
            value.bind="vatValView"
            label="PPN"
            read-only.bind="true"
            if.bind="!readOnly"
            options.bind="controlOptions">
        </au-numeric>

        <au-numeric
            value.bind="incomeTaxValView"
            label="PPH"
            read-only.bind="true"
            if.bind="!readOnly"
            options.bind="controlOptions">
        </au-numeric>

        <au-numeric
            value.bind="data.DPP"
            label="DPP"
            read-only.bind="true"
            if.bind="readOnly"
            format = "0,0.0000"
            options.bind="controlOptions">
        </au-numeric>

        <!-- <au-numeric
            value.bind="data.VatValue"
            label="PPN"
            read-only.bind="true"
            if.bind="false"
            options.bind="controlOptions">
        </au-numeric> -->

        <au-numeric
            value.bind="data.VatValueView"
            label="PPN"
            read-only.bind="true"
            if.bind="readOnly"
            options.bind="controlOptions">
        </au-numeric>

        <au-numeric
            value.bind="data.IncomeTaxValueView"
            label="PPH"
            read-only.bind="true"
            if.bind="readOnly"
            options.bind="controlOptions">
        </au-numeric>

        <au-numeric
        value.bind="data.MiscAmount"
        label="Biaya Lain-Lain"
        read-only.bind="readOnly"
        format = "0,0.00"
        options.bind="controlOptions">
        </au-numeric>

        <au-numeric
            value.bind="data.Amount"
            label="Amount"
            read-only.bind="true"
            options.bind="controlOptions">
        </au-numeric>

        <au-textbox
            show.bind="error.itemscount"
            error.bind="error.itemscount"
            read-only="true">
        </au-textbox>

        <div class="row">
      <div class="col-md-6">
        <h4>File Dokumen</h4>
        <table class="table table-hover table-bordered">
          <thead>
            <th class="col-md-11">File</th>
            <th if.bind="!readOnly" class="col-md-1">
              <button click.delegate="onAddDocument()" class="btn btn-success pull-right">+</button>
            </th>
          </thead>
          <tbody>
            <tr if.bind="!data.DocumentsFileName || data.DocumentsFileName.length < 1">
              <td colspan="2">
                Tidak ada file
              </td>
            </tr>
            <tr if.bind="data.DocumentsFileName" repeat.for="doc of data.DocumentsFileName">
              <td if.bind="readOnly">
                <button class="btn btn-primary justify-content-center"
                  click.delegate="downloadDocument($index)">${doc}</button>
                  <button type="button" class="btn btn-info ml-2"
                click.delegate="previewDocument($index)">Preview</button>
              </td>
              <td if.bind="!readOnly">
                <input if.bind="!documentsPathTemp[$index]" type="file" id="documentInput${$index}"
                  value.bind="documentUpload" change.delegate="documentInputChanged($index)"
                  accept=".pdf, .xls, .xlsx, .doc, .docx">
                <button if.bind="documentsPathTemp[$index]" class="btn btn-primary justify-content-center"
                  click.delegate="downloadDocument($index)">${doc}</button>
                <span class="text-danger" if.bind="error.DocumentsFile[$index]">${error.DocumentsFile[$index]}</span>
              </td>
              <td if.bind="!readOnly">
                <button class="btn btn-danger pull-right" click.delegate="onRemoveDocument($index)">-</button>
                
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- PDF Preview Modal -->
      <div class="modal fade" id="pdfPreviewModal" tabindex="-1" role="dialog" aria-labelledby="previewModalLabel">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
          
            <div class="resize-handle resize-n" data-direction="n"></div>
            <div class="resize-handle resize-s" data-direction="s"></div>
            <div class="resize-handle resize-e" data-direction="e"></div>
            <div class="resize-handle resize-w" data-direction="w"></div>
            <div class="resize-handle resize-ne" data-direction="ne"></div>
            <div class="resize-handle resize-nw" data-direction="nw"></div>
            <div class="resize-handle resize-se" data-direction="se"></div>
            <div class="resize-handle resize-sw" data-direction="sw"></div>
            
            <div class="modal-header">
              <h5 class="modal-title" id="previewModalLabel">Preview</h5>
              <span class="preview-size-indicator">
                Lebar: ${previewWidth}% | Tinggi: ${previewHeight}px
              </span>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <embed id="pdfEmbed" width="100%" type="application/pdf" style="display: none;" css="height: ${previewHeight}px">
              <div id="excelTable" style="display: none; overflow-y: auto;" css="max-height: ${previewHeight}px"></div>
              <img id="imagePreview" style="display: none; max-width: 100%;" css="max-height: ${previewHeight}px">
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>
    </div>

        <au-collection 
            items.bind="data.Items" 
            errors.bind="error.Items" 
            columns.bind="itemsColumns" 
            add.bind="addItems" 
            remove.bind="removeItems"
            options.one-way="filter"
            read-only.bind="readOnly"
            change.delegate="itemsChanged($event)"
            if.bind="selectedSupplier && selectedCurrency && data.Category && data.PaymentType && data.PaymentType!='T/T AFTER'"
            item-template="modules/garment-purchasing/purchasing-disposition/template/item"
            >
        </au-collection>

         <au-collection 
            items.bind="data.Items" 
            errors.bind="error.Items" 
            columns.bind="itemsColumnsNI" 
            add.bind="addItems" 
            remove.bind="removeItems"
            options.one-way="filter"
            read-only.bind="readOnly"
            change.delegate="itemsChanged($event)"
            if.bind="selectedSupplier && selectedCurrency && data.Category && data.PaymentType && data.PaymentType=='T/T AFTER'"
            item-template="modules/garment-purchasing/purchasing-disposition/template/item-NI"
            >
        </au-collection>
  </au-input-form>
</template>
