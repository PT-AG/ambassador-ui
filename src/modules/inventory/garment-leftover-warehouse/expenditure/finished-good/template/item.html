<template>
    <tr>
        <td>
            <au-autocomplete value.bind="selectedUnit" error.bind="error.Unit" loader.bind="unitLoader"
                read-only.bind="true" placeholder="Unit" text="Code">
            </au-autocomplete>
        </td>
        <td>
            <au-textbox value.bind="data.LeftoverComodity.Code" error.bind="error.LeftoverComodity" read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-textbox value.bind="data.LeftoverComodity.Name" error.bind="error.LeftoverComodity" read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-numeric value.bind="data.ExpenditureQuantity" error.bind="error.ExpenditureQuantity" read-only.bind="readOnly">
            </au-numeric>
        </td>
        <td if.bind="!readOnly">
            <button class="btn btn-danger pull-right" click.delegate="onremove(data, $event)">-</button>
        </td>
    </tr>
</template>
