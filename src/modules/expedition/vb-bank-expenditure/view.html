<template>
    <require from="../../../lib/number-format-value-converter"></require>
    <au-input-form
        title="Detail Bukti Pengeluaran Bank"
        options.bind="formOptions">
    <div class="row">

        <au-textbox 
            label="No. Dokumen"
            value.bind="data.DocumentNo"
            read-only.bind="true"
            options.bind="controlOptions">
        </au-textbox>

        <au-autocomplete 
            label="Bank"
            placeholder="pilih bank"
            value.bind="data.Bank"
            error.bind="error.Bank"
            loader.one-time="bankLoader"
            text.bind="bankView"
            read-only.bind="true"
            options.bind="controlOptions">
        </au-autocomplete>

        <au-textbox 
            label="No. Rekening"
            value.bind="data.Bank.AccountNumber"
            read-only.bind="true"
            options.bind="controlOptions"
            show.bind="data.Bank">
        </au-textbox>

        <au-autocomplete 
            value.bind="data.Currency"
            loader.one-time="currencyLoader"
            error.bind="error.Currency"
            text="Code"
            label="Mata Uang"
            read-only.bind="true"
            options.bind="controlOptions"
            placeholder="pilih mata uang">
        </au-autocomplete>

        <au-numeric 
            value.bind="data.Currency.Rate"
            read-only.bind="true"
            label="Rate"
            options.bind="controlOptions"
            format="0,000.00">
        </au-numeric>

        <au-textbox label="No. BG/Cek"
                    value.bind="data.BGCheckNo"
                    error.bind="error.BGCheckNo"
                    read-only.bind="true"
                    options.bind="controlOptions">
        </au-textbox>
        
        <au-datepicker 
            value.bind="data.Date"
            read-only.bind="true"
            error.bind="error.Date"
            label="Tanggal"
            options.bind="controlOptions">
        </au-datepicker>
        
        <au-numeric label="Biaya Lain-lain"
                    value.bind="data.OtherExpense"
                    error.bind="error.OtherExpense"
                    read-only.bind="true"
                    options.bind="controlOptions">
        </au-numeric>

        <au-numeric label="Total Bayar"
                    value.one-way="grandTotal"
                    read-only.bind="true"
                    options.bind="controlOptions"
                    format="0,000.0000">
        </au-numeric>
    </div>
    
    <au-collection
        items.bind="data.Items"
        errors.bind="error.Items"
        columns.bind="columns2"
        read-only.bind="true"
        options.bind="itemOptions"
        item-template="modules/expedition/vb-bank-expenditure/templates/item"
        add.bind="addItems"
        remove.bind="removeItems">
    </au-collection>
    <br />

    <div class="row">
        <div class="col-sm-5 col-sm-offset-7 text-right" style="font-weight: bold; font-size: 16px; margin-top: 15px; margin-bottom: 15px;">
            TOTAL BAYAR ${grandTotal | numberFormat: '0,000.0000'} ${currencyCode}
        </div>
    </div>
  </au-input-form>
</template>
