<template>
    <tr>
        <td>
            <au-autocomplete
                placeholder="pilih vb"
                value.bind="selectedVB"
                error.bind="error.vbNo"
                loader.one-time="vbLoader"
                text="DocumentNo"
                read-only.bind="options.readOnly">
            </au-autocomplete>
        </td>
        <td>
            <au-datepicker
                value.bind="data.CompletedDate"
                error.bind="error.vbNo"
                read-only.bind="true">
            </au-datepicker>
        </td>
        <td>
            <au-textbox
                value.bind="data.UnitName"
                error.bind="error.vbNo"
                read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-numeric
                value.bind="data.Amount"
                error.bind="error.vbNo"
                read-only.bind="true"
                format="0,0.00">
            </au-numeric>
        </td>
        <td>
            <au-textbox
                value.bind="data.CurrencyCode"
                error.bind="error.vbNo"
                read-only.bind="true">
            </au-textbox>
        </td>
        <td if.bind="!options.readOnly">
            <button class="btn btn-danger pull-right" click.delegate="onremove(data, $event)">-</button>
        </td>
    </tr>
</template>
