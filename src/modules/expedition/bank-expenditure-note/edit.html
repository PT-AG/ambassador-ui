<template>
    <require from="../../../lib/number-format-value-converter"></require>
    <au-input-form title="Buat Bukti Pengeluaran Bank DPP + PPN"
                   options.bind="formOptions">

        <au-textbox label="Bank"
                    value.bind="bankView"
                    read-only.bind="true"
                    options.bind="controlOptions">
        </au-textbox>

        <au-textbox label="No. Rekening"
                    value.bind="data.Bank.AccountNumber"
                    read-only.bind="true"
                    options.bind="controlOptions">
        </au-textbox>

        <au-textbox label="Mata Uang"
                    value.bind="data.Bank.Currency.Code"
                    read-only.bind="true"
                    options.bind="controlOptions"
                    show.bind="!IDR">
        </au-textbox>

        <au-textbox label="Mata Uang"
                    value.bind="data.CurrencyCode"
                    read-only.bind="true"
                    options.bind="controlOptions"
                    show.bind="IDR">
        </au-textbox>

        <au-numeric label="Rate"
                    value.bind="data.CurrencyRate"
                    read-only.bind="true"
                    options.bind="controlOptions"
                    show.bind="IDR">
        </au-numeric>

        <!-- <au-textbox label="Mata Uang"
                    value.bind="data.Bank.currency.code"
                    read-only.bind="true"
                    options.bind="controlOptions">
        </au-textbox> -->

        <au-textbox label="Supplier"
                    value.bind="data.Supplier.name"
                    read-only.bind="true"
                    options.bind="controlOptions">
        </au-textbox>

        <au-textbox label="No. BG/Cek"
                    value.bind="data.BGCheckNumber"
                    error.bind="error.BGCheckNumber"
                    options.bind="controlOptions">
        </au-textbox>

        <au-datepicker label="Tanggal"
                       value.bind="data.Date"
                       error.bind="error.Date"
                       options.bind="controlOptions">
        </au-datepicker>

        <au-numeric label="Biaya Lain-lain"
                    value.bind="data.OtherExpense"
                    error.bind="error.OtherExpense"
                    options.bind="controlOptions"
                    format="0,000.00"
                    focus.delegate="onOtherExpenseFocus($event)"
                    input.delegate="onOtherExpenseInput($event)"
                    keyup.delegate="onOtherExpenseInput($event)"
                    blur.delegate="onOtherExpenseBlur($event)">
        </au-numeric>

        <au-numeric label="Total Bayar DPP + PPN"
                    value.bind="grandTotal"
                    read-only.bind="true"
                    options.bind="controlOptions"
                    format="0,000.0000">
        </au-numeric>

        <div class="row">
            <div class="col-sm-5 col-sm-offset-4">
                <au-dropdown value.bind="selectedSortOption"
                             label="Urutkan Berdasar :"
                             options.bind="sortingControlOptions"
                             items.bind="sortingOptions"
                             change.delegate="sortItems()">
                </au-dropdown>
            </div>
            <div class="col-sm-3">
                <au-dropdown value.bind="selectedSortTypeOption"
                             options.bind="sortingTypeControlOptions"
                             items.bind="sortingTypeOptions"
                             change.delegate="sortItems()">
                </au-dropdown>
            </div>
        </div>


        <au-collection items.bind="UPOResults"
                       view-model.ref="ItemsCollectionRate"
                       errors.bind="error.Details"
                       columns.bind="collection.columns"
                       checkall.delegate="onCheckAll($event)"
                       change.delegate="onTableChange($event)"
                       item-checkbox-changed.delegate="onTableChange($event)"
                       item-template="modules/expedition/bank-expenditure-note/templates/item"
                       options.bind="collectionOptions">
        </au-collection>

        <div class="row">
            <div class="col-sm-5 col-sm-offset-7 text-right" style="font-weight: bold; font-size: 16px; margin-top: 15px; margin-bottom: 15px;">
                TOTAL BAYAR DPP + PPN ${grandTotal | numberFormat: '0,000.0000'} ${data.Bank.Currency.Code}
            </div>
        </div>
    </au-input-form>
</template>
